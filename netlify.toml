# Netlify: build sırasında her sayfa statik HTML'e çevrilir (SEO için şart).
[build]
  command = "npm run build:prerender"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Puppeteer'ın indirdiği Chrome build önbelleğinde kalsın
  PUPPETEER_CACHE_DIR = "/opt/build/repo/node_modules/.cache/puppeteer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
