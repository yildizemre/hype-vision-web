# Statik site: sayfalar `python _build/build.py` ile üretilip repoya eklenir (derleme gerekmez).
[build]
  publish = "."
  # Sayfalar repoda hazır; lead panelinden gelen yeni blog JSON'ları için build yeniden çalışır.
  command = "pip install -q beautifulsoup4 && python _build/build.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
