# Netlify: her sayfa build sırasında statik HTML'e çevrilir (SEO için şart).
# Netlify ortamında Chrome başlatılamazsa build düşmesin diye repodaki hazır dist/ yayınlanır
# (dist/ her commit öncesi `npm run build:prerender` ile lokalde güncellenir).
[build]
  command = "npm run build:prerender || (echo 'UYARI: prerender basarisiz, repodaki hazir dist yayinlaniyor' && rm -rf dist && git checkout -- dist)"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PUPPETEER_CACHE_DIR = "/opt/build/repo/node_modules/.cache/puppeteer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
